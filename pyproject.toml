[project]
name = "ha-etilbudsavis-plus"
version = "0.1.16"
description = "eTilbudsavis custom integration for Home Assistant"
requires-python = ">=3.12"
dependencies = ["aiohttp>=3.10,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1", "aioresponses>=0.7,<1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
